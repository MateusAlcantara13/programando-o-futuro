<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Perfil — Programando o Futuro</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #060b14;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 500px;
      background: radial-gradient(ellipse, rgba(37,99,235,0.1) 0%, transparent 65%);
    }

    /* NAV */
    .test-nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; font-size: 0.95rem; color: #f0f6ff;
      text-decoration: none;
    }
    .btn-sair {
      font-family: 'Manrope', sans-serif;
      font-size: 0.78rem; color: rgba(255,255,255,0.3);
      text-decoration: none; transition: color 0.2s;
    }
    .btn-sair:hover { color: rgba(255,255,255,0.7); }

    /* PROGRESS BAR */
    /* Mesma largura e mesmo eixo da coluna de conteúdo, afastada do cabeçalho */
    .progress-bar-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 720px;
      margin: 2rem auto 0;
      padding: 0 2rem;
      box-sizing: border-box;
    }
    .progress-segments {
      display: flex; align-items: center; gap: 8px;
      height: 14px;
    }
    /* Três estados com diferença de cor, de altura e de contorno:
       concluído = azul sólido; atual = mais alto, contornado em azul claro,
       com o preenchimento em azul claro; falta = cinza apagado. */
    .progress-segment {
      flex: 1; height: 8px;
      background: rgba(255,255,255,0.09);
      border-radius: 999px; overflow: hidden;
      transition: height 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .progress-segment.feito { background: #2563eb; }
    .progress-segment.atual {
      height: 14px;
      background: rgba(147,197,253,0.16);
      box-shadow: 0 0 0 2px #93c5fd;
    }
    .progress-segment-fill {
      width: 0; height: 100%;
      background: #2563eb;
      transition: width 0.25s ease;
    }
    .progress-segment.atual .progress-segment-fill { background: #93c5fd; }

    /* MAIN */
    /* Alinhado pelo topo, e não pelo meio: o rótulo fica no terço superior
       e a coluna não pula de altura entre perguntas de tamanhos diferentes. */
    main {
      flex: 1; display: flex; align-items: flex-start; justify-content: center;
      padding: clamp(2rem, 9vh, 5.5rem) 2rem 2rem;
      position: relative; z-index: 1;
    }

    .question-wrap {
      max-width: 720px; width: 100%;
    }

    /* A animação de troca de pergunta fica no questionario-api.js
       (trocarTela), com 260 ms no total e desligada em prefers-reduced-motion. */
    .question-card[hidden], .block-intro[hidden] { display: none; }

    /* Tela de transição entre blocos */
    .block-intro-text {
      font-family: 'Manrope', sans-serif;
      font-size: 1rem; line-height: 1.65;
      color: rgba(255,255,255,0.6);
      margin: -1rem 0 2rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-segment, .progress-segment-fill { transition: none; }
    }

    /* Rótulo do bloco: a principal pista de orientação da tela.
       #93c5fd sobre #060b14 dá contraste de cerca de 11:1. */
    .question-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem; font-weight: 700;
      color: #93c5fd; letter-spacing: 0;
      margin-bottom: 0.9rem;
    }

    /* Número da parte na tela de transição: "2/5" grande */
    .block-intro-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800; line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }
    .block-intro-num .parte-atual {
      font-size: clamp(4rem, 11vw, 6rem);
      color: #93c5fd;
    }
    .block-intro-num .parte-total {
      font-size: clamp(2rem, 5.5vw, 3rem);
      color: rgba(255,255,255,0.35);
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }
    .question-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 800; color: #f0f6ff;
      line-height: 1.3; margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    /* Opções */
    .options-list {
      display: flex; flex-direction: column; gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .option-btn {
      width: 100%; padding: 1rem 1.2rem;
      background: rgba(17,24,39,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; text-align: left;
      font-family: 'Manrope', sans-serif;
      font-size: 0.9rem; font-weight: 500; color: rgba(255,255,255,0.7);
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 1rem;
    }
    .option-btn:hover {
      border-color: rgba(37,99,235,0.4);
      background: rgba(37,99,235,0.06);
      color: #f0f6ff;
    }
    .option-btn.selected {
      border-color: #2563eb;
      background: rgba(37,99,235,0.12);
      color: #f0f6ff;
    }
    .option-letter {
      width: 28px; height: 28px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700;
      color: rgba(255,255,255,0.4);
      transition: all 0.2s;
    }
    .option-btn.selected .option-letter {
      background: #2563eb; border-color: #2563eb; color: #fff;
    }
    .option-btn:hover .option-letter {
      border-color: rgba(37,99,235,0.5);
      color: rgba(255,255,255,0.7);
    }

    /* Navegação */
    .nav-btns {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .btn-voltar {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.75rem 1.4rem;
      background: transparent; color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-voltar:hover {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
    }
    .btn-voltar:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-proximo {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.8rem;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s;
      opacity: 0.4; pointer-events: none;
    }
    .btn-proximo.enabled {
      opacity: 1; pointer-events: all;
    }
    .btn-proximo.enabled:hover {
      background: #3b82f6; transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    }

    /* FOOTER */
    .page-footer {
      position: relative; z-index: 2;
      text-align: center; padding: 1rem;
      font-size: 0.7rem; color: rgba(255,255,255,0.15);
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .test-nav { padding: 1rem 1.2rem; }
      .progress-bar-wrap { padding: 0 1.2rem; margin-top: 1.25rem; }
      main { padding: 1.75rem 1.2rem 1.5rem; }
      .question-num { font-size: 0.95rem; }
      .question-text { font-size: 1.2rem; }
      .option-btn { font-size: 0.82rem; padding: 0.85rem 1rem; }
      .block-intro-text { font-size: 0.92rem; }
    }

    @media (max-width: 400px) {
      .question-card {
        padding: 1.2rem 1rem;
      }
      .question-text {
        font-size: 1rem;
      }
      .option-btn {
        font-size: 0.78rem;
        padding: 0.75rem 0.9rem;
      }
      .btn-proximo, .btn-voltar {
        font-size: 0.78rem;
        padding: 0.7rem 1rem;
      }
      .nav-btns {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- NAV -->
  <nav class="test-nav">
    <a href="inicial_mapa_feito.html" class="nav-logo font-jakarta">Programando o Futuro</a>

    <a href="inicial_mapa_feito.html" class="btn-sair font-manrope">Salvar e Sair</a>
  </nav>

  <!-- PROGRESSO: um segmento por bloco, montado pelo questionario-api.js -->
  <div class="progress-bar-wrap">
    <div class="progress-segments" id="progressSegments" role="progressbar" aria-label="Progresso do teste"></div>
  </div>

  <!-- MAIN -->
  <main>
    <div class="question-wrap">
      <!-- Tela de transição entre blocos -->
      <section class="block-intro" id="blockIntro" hidden>
        <div class="block-intro-num font-jakarta" id="blockIntroEyebrow"></div>
        <h2 class="question-text font-jakarta" id="blockIntroTitle"></h2>
        <p class="block-intro-text font-manrope" id="blockIntroText"></p>
        <div class="nav-btns">
          <button type="button" class="btn-voltar font-jakarta" id="blockIntroVoltar">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Voltar
          </button>
          <button type="button" class="btn-proximo enabled font-jakarta" id="blockIntroContinuar">
            Continuar
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </section>

      <div class="question-card" id="questionCard">

        <div class="question-num font-jakarta" id="questionNum">Pergunta 01</div>
        <h2 class="question-text font-jakarta" id="questionText"></h2>

        <div class="options-list" id="optionsList"></div>

        <div class="nav-btns">
          <button class="btn-voltar font-jakarta" id="btnVoltar" onclick="voltarPergunta()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Voltar
          </button>
          <button class="btn-proximo font-jakarta" id="btnProximo" onclick="proximaPergunta()">
            Próxima
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </main>

  <footer class="page-footer font-jakarta">© 2026 Programando o Futuro</footer>
  <script src="../js/api.js"></script>
  <script src="../js/questionario-api.js"></script>

</body>
</html>
